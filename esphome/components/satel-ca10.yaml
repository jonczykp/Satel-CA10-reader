esphome:
  name: satel-ca10

esp8266:
  board: d1_mini_lite

logger:
api:
ota:
  platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    # or from git:
    # - source: github://jonczykp/Satel-CA10-reader
    #   path: esphome/components

satel_ca10:
  id: satel
  clk_pin: D1
  data_pin: D5

binary_sensor:
  - platform: satel_ca10
    led: led1
    name: "Satel LED01"
    device_class: motion
  - platform: satel_ca10
    led: led2
    name: "Satel LED02"
    device_class: motion
  # led3 ... led8 work the same way
  - platform: satel_ca10
    led: warning
    name: "Satel Warning"
    device_class: problem
  - platform: satel_ca10
    led: zone1
    name: "Satel Zone1"
    device_class: running
  - platform: satel_ca10
    led: zone2
    name: "Satel Zone2"
    device_class: running
  - platform: satel_ca10
    led: alarm
    name: "Satel Alarm"
    device_class: sound
  # any other frame bit (0-31):
  # - platform: satel_ca10
  #   bit: 5
  #   name: "Custom bit"
